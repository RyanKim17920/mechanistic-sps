# Logging configuration

wandb_log: true
wandb_project: sps
wandb_entity: null  # null = log to your default W&B entity; set to a team/org to override. Disable W&B entirely with logging.wandb_log=false
wandb_run_name: default_run  # Override in experiment configs or via CLI
wandb_dir: ${system.out_root}/wandb  # Local W&B run files: run outputs, so they follow out_root
