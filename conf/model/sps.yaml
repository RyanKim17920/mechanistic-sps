# SPS: one weight-shared stack over the interleaved (token, <predict>) 2T sequence.

defaults:
  - tokens@config: gpt2_predict   # vocab / eos / pad / predict ids
  - _self_

_target_: modeling.models.sps.SPSModel

config:
  _target_: modeling.models.sps.SPSConfig
  # Architecture
  block_size: 4096
  n_layer: 12
  n_head: 12
  hidden_size: 768
  intermediate_size: 2304
  norm_eps: 1e-6
  dropout: 0.0
  bias: false
  # Sliding-predicts
  window_size: 16
  enable_triton_attention: true
  warp_specialize: false
