[project]
name = "two-tower-sps"
version = "0.1.0"
description = "Code, configs and results for the paper: Which State Should Prediction Read? A Mechanistic Analysis of State-Prediction Separation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets<=3.6.0",
    "huggingface-hub>=0.35.3",
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "pytest>=8.4.2",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    "setuptools>=80",  # torch.compile (inductor) imports it; torch declares it only for Python >= 3.12
    "tiktoken>=0.12.0",
    "torch==2.9.0",
    "tqdm>=4.67.1",
    "wandb>=0.22.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/modeling/tests"]
# Repo root on sys.path so tests can import the scripts (`import scripts.analysis...`).
pythonpath = ["."]
markers = [
    "cuda: requires CUDA GPU",
    "triton: requires Triton (implies CUDA)",
    "slow: long-running stability/mismatch diagnostics (use --run-slow to enable)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# Long lines, late imports after sys.path setup, one-letter math names, compact
# `a = 1; b = 2` statements and closures called inside their loop are deliberate here.
ignore = ["E501", "E402", "E702", "E731", "E741", "B023", "B905"]
